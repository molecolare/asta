<script>

  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },

async function chiama(metodo, percorso, corpo) {

}
const rpc = (nome, par) => chiama("POST", "/rest/v1/rpc/" + nome, par || {});
const leggiTab = q => chiama("GET", "/rest/v1/" + q);

let toastT = null;

  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", err ? 7000 : 4500);
}
function beep(freq, ms) {
  try {
    const c = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)());
    if (c.state === "suspended") c.resume();
    const o = c.createOscillator(), g = c.createGain();

    o.start(); o.stop(c.currentTime + ms / 1000);
  } catch (e) {}
}
function tema(t) { document.body.dataset.tema = t; ls.set("fm_tema", t); }
document.querySelectorAll(".temi button").forEach(b => b.onclick = () => tema(b.dataset.t));
tema(ls.get("fm_tema", "verde"));
document.body.dataset.scala = ls.get("fm_scala", "1");

// ---------------------------------------------------------------------------------------------
// Dati e regole (copia in JavaScript delle funzioni di sola lettura di fantamusica.py)
// ---------------------------------------------------------------------------------------------
let io = null;                       // {codice, nome, ruolo}
let S = { dati: null, prefs: {}, richieste: [], versione: null, vuoto: false };
let D = null, MUS = new Map(), GRP = new Map(), PT = { mus: new Map(), ut: new Map(), coppie: new Map() };
const SINGOLARI = { minuti: "minuto", ore: "ora", giorni: "giorno", secondi: "secondo", settimane: "settimana", mesi: "mese", anni: "anno" };

function indicizza() {
  D = S.dati;
  MUS = new Map(D.musicisti.map(m => [m.id, m]));
  GRP = new Map();                      // gruppo -> righe dell'evento, per i dettagli degli elenchi
  PT = { mus: new Map(), ut: new Map(), coppie: new Map() };   // punti sommati una volta sola
  const piu = (m, k, v) => m.set(k, (m.get(k) || 0) + v);
  D.eventi.forEach(e => {
    if (e.gruppo) {
      if (!GRP.has(e.gruppo)) GRP.set(e.gruppo, []);
      GRP.get(e.gruppo).push(e);
    }
    if ((e.stato || "ok") !== "ok") return;
    piu(PT.mus, e.musicista_id, e.punti);
    if (e.proprietario) {
      piu(PT.ut, e.proprietario, e.punti);
      piu(PT.coppie, e.musicista_id + "|" + e.proprietario, e.punti);
    }
  });
  GRP.forEach(v => v.sort((a, b) => a.id - b.id));
}
const U = nome => D.utenti.find(u => u.nome.toLowerCase() === String(nome).toLowerCase());
const giocatori = () => D.utenti.filter(u => u.gioca);
const rosa = nome => D.musicisti.filter(m => m.proprietario === nome);
const speso = nome => rosa(nome).reduce((s, m) => s + m.prezzo, 0);
const crediti = nome => { const u = U(nome); return D.impostazioni.budget_iniziale - speso(nome) + (u ? (u.saldo || 0) : 0); };
const eventiOk = () => D.eventi.filter(e => (e.stato || "ok") === "ok");
const eventiPending = () => D.eventi.filter(e => e.stato === "pending");
const puntiMus = (mid, prop) => (prop === undefined ? PT.mus.get(mid) : PT.coppie.get(mid + "|" + prop)) || 0;
const puntiUt = nome => PT.ut.get(nome) || 0;
const nomeMus = mid => { const m = MUS.get(mid); return m ? m.nome : "?"; };
const soprUt = nome => { const u = U(nome); return u && u.soprannome ? u.soprannome : ""; };
const etichettaUt = nome => soprUt(nome) ? `${nome} (${soprUt(nome)})` : nome;
const mioSopr = mid => ((S.prefs && S.prefs.soprannomi_musicisti) || {})[String(mid)] || "";
const campiPer = per => (D.campi || []).filter(c => c.per === per);
const valProfilo = (el, c) => (el.profilo || {})[String(c.id)];
function posizioni(valori) { const p = []; valori.forEach((v, i) => p.push(i && v === valori[i - 1] ? p[p.length - 1] : i + 1)); return p; }
function classificaGiocatori() {
  const dati = giocatori().map(u => [u.nome, puntiUt(u.nome)]).sort((a, b) => b[1] - a[1] || a[0].toLowerCase().localeCompare(b[0].toLowerCase()));
  const pos = posizioni(dati.map(x => x[1]));
  return dati.map(([nome, punti], i) => ({ pos: pos[i], nome, punti }));
}
function classificaMusicisti() {
  const dati = D.musicisti.map(m => [m, puntiMus(m.id)]).sort((a, b) => b[1] - a[1] || a[0].nome.toLowerCase().localeCompare(b[0].nome.toLowerCase()));
  const pos = posizioni(dati.map(x => x[1]));
  return dati.map(([m, punti], i) => ({ pos: pos[i], m, punti }));
}
function calcolaPunti(base, bonus) {
  let tot = Math.trunc(base) + bonus.filter(b => b.tipo === "punti").reduce((s, b) => s + Math.trunc(b.valore), 0);
  const perc = bonus.filter(b => b.tipo === "percentuale").reduce((s, b) => s + Number(b.valore), 0);
  return tot + Math.floor(tot * perc / 100 + 1e-9);
}
const slotAzione = a => [{ ruolo: a.ruolo || "", punti: a.punti, min: a.min, max: a.max }].concat((a.extra || []).map(x => Object.assign({}, x)));
function descriviSlot(a, s) {
  if (a.modalita === "sondaggio") return `sondaggio ${s.min}-${s.max}`;
  if (a.modalita === "tempo") return `${sgn(s.punti)} per ${SINGOLARI[a.unita] || a.unita}`;
  return sgn(s.punti);
}
function descriviPunteggio(a) {
  const sl = slotAzione(a);
  return sl.length === 1 ? descriviSlot(a, sl[0]) : sl.map(s => `${s.ruolo}: ${descriviSlot(a, s)}`).join(" | ");
}
const descriviBonus = b => `${b.nome} (${sgn(b.valore)}${b.tipo === "percentuale" ? "%" : ""})`;
// opz.breve: senza il numero di gruppo; opz.senzaRuolo: senza il ruolo (nei dettagli è già accanto al nome)
function descriviCalcolo(e, opz) {
  opz = opz || {};
  const p = [];
  if (e.dittatura) p.push("DITTATURA"); else if (e.dettaglio) p.push(e.dettaglio);
  if (((e.bonus || []).length || (e.bonus_auto || []).length) && !e.dittatura) {
    if (e.base !== null && e.base !== undefined) p.push("base " + e.base);
    (e.bonus || []).forEach(b => p.push(descriviBonus(b)));
    (e.bonus_auto || []).forEach(b => p.push(descriviBonus(b)));
  }
  if (e.ruolo && !opz.senzaRuolo) p.push(e.ruolo === "extra" ? "altro coinvolto" : "ruolo " + e.ruolo);
  if (e.gruppo && !opz.breve) p.push("gruppo " + e.gruppo);
  return p.join("; ");
}
const dataEv = e => e.data_completamento || e.data;
function gruppoEvento(e) {
  if (!e.gruppo) return [e];
  const g = GRP.get(e.gruppo);          // indicizzato in indicizza(): niente scansioni per ogni riga
  return g && g.length ? g : [e];
}
function comprimiGruppi(ev) {
  const princ = new Map();
  ev.forEach(e => { if (e.gruppo && (!princ.has(e.gruppo) || e.id < princ.get(e.gruppo).id)) princ.set(e.gruppo, e); });
  const out = [], visti = new Set();
  ev.forEach(e => {
    if (!e.gruppo) return out.push(e);
    if (visti.has(e.gruppo)) return;
    visti.add(e.gruppo); out.push(princ.get(e.gruppo));
  });
  return out;
}
const etichettaRuolo = e => (e.ruolo || "") === "extra" ? "altro coinvolto" : (e.ruolo || "");
function descriviCoinvolti(e) {
  const altri = gruppoEvento(e).filter(x => x.id !== e.id);
  if (!altri.length) return "";
  const pend = altri.filter(x => (x.stato || "ok") === "pending").length;
  return `+${altri.length} coinvolt${altri.length === 1 ? "o" : "i"}` + (pend ? `, ${pend} in pending` : "");

// Periodi degli elenchi eventi (stessi codici delle preferenze di fantamusica.py)
const PERIODI = [["1h", "ultim'ora"], ["3g", "ultimi 3 giorni"], ["7g", "ultima settimana"],
                 ["30g", "ultimo mese"], ["90g", "ultimi 3 mesi"], ["tutto", "tutta la stagione"]];

// Le date degli eventi sono scritte nel fuso del gioco (lato Supabase: asta_config.fuso), non in quello
// del telefono: chi gioca dall'estero deve vedere lo stesso elenco di chi è in Italia.
const FUSO_GIOCO = "Europe/Rome";
function oraGioco(d) {
  try {
    return new Intl.DateTimeFormat("sv-SE", { timeZone: FUSO_GIOCO, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(d).replace("T", " ");
  } catch (e) {                         // browser senza fusi IANA: si usa l'ora del dispositivo
    const due = x => String(x).padStart(2, "0");
    return `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())} ${due(d.getHours())}:${due(d.getMinutes())}`;
  }
}
function inizioPeriodo(p) {
  if (!p || p === "tutto") return null;
  const n = parseInt(p, 10), unita = p.slice(-1);
  if (!n || (unita !== "h" && unita !== "g")) return null;
  // si sottrae sul calendario, non sull'istante (come fa l'app): così attorno al cambio dell'ora legale
  // la pagina e l'app mostrano gli stessi eventi. Formato uguale a quello delle date degli eventi.
  const t = Date.parse(oraGioco(new Date()).replace(" ", "T") + ":00Z") - n * (unita === "h" ? 3600e3 : 86400e3);
  return new Date(t).toISOString().slice(0, 16).replace("T", " ");
}
function filtroPeriodo(p) {
  const da = inizioPeriodo(p);
  return da ? (e => dataEv(e) >= da) : null;
}
function eventiRecenti(n, filtro, comprimi) {
  let ev = D.eventi.filter(e => !filtro || filtro(e));
  ev.sort((a, b) => (dataEv(a) < dataEv(b) ? 1 : dataEv(a) > dataEv(b) ? -1 : b.id - a.id));
  if (comprimi) ev = comprimiGruppi(ev);
  return n ? ev.slice(0, n) : ev;
}
const scambiFatti = nome => D.scambi.filter(x => x.stato === "accettato" && (x.da === nome || x.a === nome)).length;
function simulaScambio(p) {
  const imp = D.impostazioni, nMax = imp.musicisti_per_squadra;
  const da = U(p.da), a = U(p.a);
  if (!da || !a || da === a || !da.gioca || !a.gioca) return ["Giocatori non validi per lo scambio.", null];

  chiedi(`Annullare l'asta di ${c.musicista}? Le offerte vengono cancellate.`, "Annulla l'asta", () => adminAsta("asta_a_annulla", {}, "Asta annullata"));
}
const msgAsta = t => adminAsta("asta_a_messaggio", { p_testo: t }, "Messaggio inviato");
let contoTimer = null;
function contoAsta(n) {
  clearInterval(contoTimer);
  let k = n;
  const passo = () => { rpc("asta_a_messaggio", { p_admin: io.codice, p_testo: String(k) }).catch(() => {}); k--; if (k <= 0) clearInterval(contoTimer); };
  passo();
  contoTimer = setInterval(passo, 1000);
}
function nuovoMessaggio(testo) {
  if (/^\d{1,3}$/.test(testo.trim())) {
    const c = $("#conto"); c.textContent = testo.trim(); c.style.display = "flex";
    clearTimeout(contoT); contoT = setTimeout(() => c.style.display = "none", 900); beep(1000, 150); return;
  }
  const b = $("#banner"); b.textContent = testo; b.style.display = "block";
  clearTimeout(bannerT); bannerT = setTimeout(() => b.style.display = "none", 8000); beep(740, 200);
}
async function messaggiNuovi() {
  if (ultimoM === null) return;
  const nuovi = await leggiTab(`asta_messaggi?select=*&id=gt.${ultimoM}&order=id.asc&limit=20`);
  nuovi.forEach(m => nuovoMessaggio(m.testo));
}

// ---------------------------------------------------------------------------------------------
// Collegamento: accesso, caricamento, controllo periodico
// ---------------------------------------------------------------------------------------------
let firma = null, occupato = false, ultimoOk = 0, timers = [];
async function carica() {
  const r = await rpc("fm_leggi", { p_codice: io.codice });
  if (!r.ok) throw new Error(r.errore || "Accesso negato");
  S.vuoto = !!r.vuoto;
  if (!r.vuoto) { S.dati = r.dati; S.versione = r.versione; S.prefs = r.prefs || {}; S.richieste = r.richieste || []; S.codici = r.codici || null; indicizza(); notificaRichieste(); }
  if (!sporco && !(vista.tab === "asta" && $("#as-root"))) render(); else disegnaNav();
  ultimoOk = Date.now();
}
async function controlla() {
  if (!io || occupato) return;
  occupato = true;
  try {
    const v = await rpc("fm_versione");
    const f = `${v.v}|${v.n}|${v.e}`;
    if (f !== firma) { firma = f; await carica(); }
    if (v.m !== ultimoM) { const prima = ultimoM; if (prima !== null) await messaggiNuovi(); ultimoM = v.m; if (vista.tab === "asta") await caricaAsta(); }
    else if (v.a !== controlla.a) { if (vista.tab === "asta") await caricaAsta(); }
    controlla.a = v.a;
    ultimoOk = Date.now();
    $("#stato").textContent = "● online"; $("#stato").style.color = "var(--accent)";
  } catch (e) {
    $("#stato").textContent = "● non raggiungibile"; $("#stato").style.color = "var(--rosso)";
  } finally { occupato = false; }
}
async function entra(codice) {
  $("#loginerr").textContent = "";
  let r;
  try { r = await rpc("fm_login", { p_codice: codice }); }
  catch (e) { $("#loginerr").textContent = "Errore di connessione: " + e.message; return false; }
  if (!r.ok) { $("#loginerr").textContent = r.errore || "Codice non valido"; return false; }
  io = { codice, nome: r.nome, ruolo: r.ruolo };
  ls.set("fm_codice", codice);
  $("#login").classList.add("nascosto"); $("#app").classList.remove("nascosto"); $("#nav").classList.remove("nascosto");
  $("#esci").classList.remove("nascosto");
  if (io.ruolo === "giocatore") $("#btnRich").classList.remove("nascosto");
  $("#chi").textContent = io.ruolo === "admin" ? "ADMIN" : io.nome;
  try { await carica(); } catch (e) { $("#app").append(h("div", { class: "card esito err", text: "Errore: " + e.message })); }
  try { const m = await rpc("fm_versione"); ultimoM = m.m; firma = `${m.v}|${m.n}|${m.e}`; controlla.a = m.a; } catch (e) {}
  timers.push(setInterval(controlla, 2500));
  if (io.ruolo === "giocatore") { const ping = () => rpc("asta_ping", { p_codice: io.codice }).catch(() => {}); ping(); timers.push(setInterval(ping, 10000)); }
  return true;
}
$("#entra").onclick = () => { beep(660, 80); entra($("#codice").value.trim()); };
$("#codice").addEventListener("keydown", e => { if (e.key === "Enter") $("#entra").click(); });
$("#esci").onclick = () => { ls.del("fm_codice"); location.reload(); };
$("#modale").addEventListener("click", e => { if (e.target.id === "modale") chiudiModale(); });
{ const salvato = ls.get("fm_codice", ""); if (salvato) { $("#codice").value = salvato; entra(salvato); } }
